[[site]]
path = "src/scheinbild_model/streaking_field.py"
definition = "GAUSSIAN_EXPONENT"
literals = [2.0]
reason = """
The Gaussian two, the same one the pulse module carries. The envelope is
exp(-a t^2) in the amplitude, so it is exp(-2 a t^2) in the intensity, and a full
width at half maximum of tau gives a = 2 ln 2 / tau^2. Algebra of the chosen
shape rather than a measurement."""

[[site]]
path = "src/scheinbild_model/streaking_field.py"
definition = "KINETIC_ENERGY_COEFFICIENT"
literals = [2.0]
reason = """
The two in the definition of kinetic energy: a kinetic energy of K belongs to a
momentum of sqrt(2 K), and an energy is a momentum squared over two. A
definition rather than a quantity anything measured."""
